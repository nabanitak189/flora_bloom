<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Control a blooming flower with hand gestures in real-time using your webcam">
    <title>Flower Bloom — Hand Gesture Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Webcam feed -->
        <video id="webcam" autoplay playsinline></video>

        <!-- Canvas overlay for rendering flower + hand skeleton -->
        <canvas id="canvas"></canvas>

        <!-- Subtle vignette -->
        <div class="vignette"></div>

        <!-- Loading screen -->
        <div class="loading-overlay" id="loading">
            <div class="loading-flower"></div>
            <div class="loading-text">Initializing Hand Tracking</div>
            <div class="loading-subtext">Please allow camera access</div>
        </div>

        <!-- Instructions -->
        <div class="instructions" id="instructions">
            <span>Left hand pinch</span> controls Bloom &nbsp;·&nbsp;
            <span>Right hand pinch</span> controls Growth &nbsp;·&nbsp;
            <span>Sway hands</span> to create wind
        </div>

        <!-- Controls -->
        <div class="controls" id="controls" aria-hidden="false">
            <label for="flowerTypeSelect">Flower type</label>
            <select id="flowerTypeSelect" aria-label="Select flower type">
                <option value="flora1">Flora1</option>
                <option value="flora2">Flora2</option>
            </select>
            <label for="flowerColorSelect">Flower color</label>
            <select id="flowerColorSelect" aria-label="Select flower color">
                <option value="pink">Pink</option>
                <option value="red">Red</option>
                <option value="orange">Orange</option>
                <option value="yellow">Yellow</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="purple">Purple</option>
                <option value="white">White</option>
            </select>
        </div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

    <!-- Application -->
    <script src="app.js"></script>
</body>
</html>
